# DCMF -- milestone 1 test configuration.
#
# Press F11 in game to open the panel, then "Apply the INI" under Diagnostics
# to replay this file onto the target. Nothing here is applied on its own.
# Everything is logged to:
#     Documents/My Games/Skyrim Special Edition/SKSE/DCMF.log

[Test]

# Which actor to drive: nearest | selected | player
#
# "nearest" is the default and picks the closest loaded NPC to you. The player's
# head is not rendered in first person, so targeting the player makes a working
# morph look identical to a broken one. "selected" uses the console selection,
# but falls back to nearest when nothing is selected.

target = selected

# TRI files to load. Repeatable, and loading several is the point: morphs are
# resolved by (name, vertex count), so heads of different topologies coexist and
# the right one binds automatically to whichever actor you select.
#
# These four cover every head topology found loose in this load order:
#
#   996    Expressive Facial Animation, over the vanilla head path
#   3832   High Poly Head
#   11498  UBE 2.0
#   12206  the "DF Edit" family used by many NPC replacers
#
# Paths are resolved by the game process, so Data-relative paths go through Mod
# Organizer's virtual file system. An absolute path also works and bypasses it.

# A face is not one mesh. Head, mouth, eyes, lashes and brows are separate
# geometries with separate topologies, and each needs its own TRI -- morph the
# head alone and the jaw opens while the mouth stays shut.
#
# Morphs resolve by (name, vertex count), so several TRIs can contribute to the
# same topology. Loading the base set and the EXPR2 set below gives an 11498
# vertex UBE head 49 + 14 = 63 morphs.

# --- UBE female, base expression set (49 morphs each) ---
tri = Data/meshes/!UBE/Head/FemaleHead.tri
tri = Data/meshes/!UBE/Mouth/mouthhumanf_tangent.tri
tri = Data/meshes/!UBE/Eyes/eyesfemale.tri
tri = Data/meshes/!UBE/Eyes/eyesfemale_outer.tri
tri = Data/meshes/!UBE/Eyes/eyesfemale_shadows.tri
tri = Data/meshes/!UBE/Eyes/LensFemaleLeft.tri
tri = Data/meshes/!UBE/Lashes/EyeFemaleLashes.tri
tri = Data/meshes/!UBE/Brows/femaleheadbrows.tri

# --- UBE EXPR2: 14 extra expressions with no MFG channel ---
#
# EXPR2_Smile_Open, EXPR2_Mouth_Open_Wide, EXPR2_Cheek_Pull_Left/Right and the
# rest exist only as vertex deltas. The engine's 17 expressions / 16 phonemes /
# 14 modifiers cannot address them, which is precisely why this plugin drives
# morphs directly rather than only through keyframes.
tri = Data/meshes/actors/character/facegenmorphs/morphs/LRO/EXPR2/FemaleHead.tri
tri = Data/meshes/actors/character/facegenmorphs/morphs/LRO/EXPR2/MouthHumanF.tri
tri = Data/meshes/actors/character/facegenmorphs/morphs/LRO/EXPR2/Eyesfemale.tri
tri = Data/meshes/actors/character/facegenmorphs/morphs/LRO/EXPR2/Eyesfemale_outer.tri
tri = Data/meshes/actors/character/facegenmorphs/morphs/LRO/EXPR2/eyesfemale_shadows.tri
tri = Data/meshes/actors/character/facegenmorphs/morphs/LRO/EXPR2/EyeFemaleLashes.tri
tri = Data/meshes/actors/character/facegenmorphs/morphs/LRO/EXPR2/FemaleBrows.tri

# --- Male heads. UBE ships no male head, so these are the vanilla and High
#     Poly Head male topologies (898 and 3598 vertices). Without them a male
#     actor has nothing to morph at all.
tri = Data/meshes/actors/character/character assets/MaleHead.tri
tri = Data/meshes/KL/High Poly Head/malehead.tri

# --- Other female head types, heads only for now ---
tri = Data/meshes/actors/character/character assets/FemaleHead.tri
tri = Data/meshes/KL/High Poly Head/femalehead.tri
tri = Data/meshes/BDF/Head/FemaleHead.tri
tri = Data/meshes/BDF/mouth/MouthHumanF.tri
tri = Data/meshes/BDF/eyes/eyesfemale.tri
tri = Data/meshes/BDF/brows/femaleheadbrows.tri

# RaceMenu's sliders are a DIFFERENT file: the *chargen* TRI, which holds sculpt
# morphs (BrowIn, JawWide, NoseShort, Overbite ...) rather than expressions.
# That is why its list does not match this one. Chargen morphs are SKEE's to
# own; uncomment to animate them as per-frame deltas instead.
#
# tri = Data/meshes/!UBE/Head/FemaleHeadCharGen.tri

# Morphs to hold, repeatable, as <name>:<weight>. Weight 1.0 is the morph at
# full authored amplitude.
#
# BigAah drops the jaw wide open -- deliberately chosen because milestone 1 is
# about seeing the face move at all, not about looking good. It is present on
# every topology listed above. BrowUpLeft is a subtler alternative.
#
# tri_dump lists every morph a given head actually has.

morph = BigAah:1.0

# Engine-driven expression override, as <index>:<value>, repeatable.
#
# This does NOT use our vertex writes. It calls the game's own
# SetExpressionOverride, so the engine does its morph work and whatever it
# normally does to put the result on screen.
#
# It is the control in the experiment: if the face changes for this but not for
# `morph` above, then our vertex writes are landing in memory but never reaching
# the GPU. If neither changes anything, the actor simply is not being seen.
#
# Indices: 0-6 Dialogue Anger/Fear/Happy/Sad/Surprise/Puzzled/Disgusted,
#          7-14 Mood Neutral/Anger/Fear/Happy/Sad/Surprise/Puzzled/Disgusted,
#          15 CombatAnger, 16 CombatShout.
# Values are 0.0-1.0.

# expression = 16:1.0

# Set to 1 to dump the facegen call graph to the log on reload. That is what
# identifies the deeper apply function: the game's .text is encrypted on disk,
# so it can only be read from inside the running process.

analyze = 0

